name: Deploy to Modal

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recreate_site:
        description: Replace warm site containers after a runtime secret change
        type: boolean
        default: false
      recreate_api:
        description: Replace warm API containers after a runtime secret change
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: modal-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CONTEXT_DEV_API_KEY: ${{ secrets.CONTEXT_DEV_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      # Judges' codes: without them the public site would use the paid APIs for everyone, so deploying stops.
      ACCESS_CODES: ${{ secrets.ACCESS_CODES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Modal
        run: python -m pip install modal python-dotenv
      - name: Check deployment credentials
        run: |
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          test -n "$EXA_API_KEY"
          test -n "$GEMINI_API_KEY"
          test -n "$ACCESS_CODES" || { echo "Set the ACCESS_CODES secret first (judge-only live mode)"; exit 1; }
      - name: Deploy website and bundled API
        env:
          RECREATE_SITE: ${{ inputs.recreate_site }}
        run: |
          if [ "$RECREATE_SITE" = "true" ]; then
            modal deploy --strategy recreate frontend/modal_app.py
          else
            modal deploy frontend/modal_app.py
          fi
      - name: Deploy separate API
        env:
          RECREATE_API: ${{ inputs.recreate_api }}
        run: |
          if [ "$RECREATE_API" = "true" ]; then
            modal deploy --strategy recreate backend/modal_app.py
          else
            modal deploy backend/modal_app.py
          fi
      - name: Verify website and API
        run: |
          curl --fail --retry 3 --retry-delay 5 --max-time 60 https://what-now-by-meridian--site.us-east.modal.run/ --output /dev/null
          curl --fail --retry 3 --retry-delay 5 --max-time 60 https://what-now-by-meridian--site.us-east.modal.run/api/health --output /dev/null
